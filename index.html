<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fcfbfa;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            border: 1px solid #f0edf8;
        }
        .brand-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #1a252f;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .brand-subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .form-heading {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 10px;
        }
        .form-text {
            font-size: 14px;
            color: #95a5a6;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .input-field {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f8fafc;
            color: #2c3e50;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #b2c2bf;
            background-color: #fff;
        }
        .submit-btn {
            width: 100%;
            background-color: #2c3e50;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-title">Goddess Fuel</h1>
        <p class="brand-subtitle">Marine Herbalism</p>
        
        <h2 class="form-heading">Join the Apothecary</h2>
        <p class="form-text">Subscribe to receive exclusive updates on deep sea wellness protocols and botanical insights.</p>
        
        <form action="https://mcp.beehiiv.com/mcp" method="POST">
            <input type="email" name="email" placeholder="Enter your email address" required class="input-field">
            <button type="submit" class="submit-btn">Subscribe</button>
        </form>
    </div>

</body>
